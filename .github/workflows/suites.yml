name: suites

# Las mismas comprobaciones que el pre-commit local, en GitHub: si alguien commitea sin el hook
# (o lo salta), aquí se ve. Windows porque el tooling del repo es PowerShell 5.1.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags incluidos: la versión de los plugins sale de ellos

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Archivos generados al día (plugins y docs)
        shell: powershell
        run: |
          # Misma versión que la commiteada: la del plugin core (evita diferencias por el nº de commits)
          $env:SENZU_RELEASE = (Get-Content plugins\senzu-core\.claude-plugin\plugin.json -Raw | ConvertFrom-Json).version
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-plugins.ps1 | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-docs.ps1 | Out-Null
          git -c core.autocrlf=true diff --stat --exit-code -- plugins .claude-plugin docs REFERENCIA.md CREDITOS.md
          if ($LASTEXITCODE -ne 0) { Write-Host 'Hay archivos generados sin actualizar: ejecuta build-plugins y build-docs y commitea.'; exit 1 }

      - name: check-skills (conectividad y reglas de Codex)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-skills.ps1

      - name: test-router (frase del usuario -> skill)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-router.ps1

      - name: test-hooks (muros)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-hooks.ps1

      - name: Licencias de terceros (todas permitidas y con su archivo)
        run: node tools/build-creditos.mjs --comprobar

      - name: test-memoria (buscador del devlog y hooks de memoria)
        run: node tools/test-memoria.mjs

      - name: test-hooks-codex (parches de Codex y formateo sin imponer estilo)
        run: node tools/test-hooks-codex.mjs

      - name: test-permisos (permisos por proyecto y hooks apagados)
        run: node tools/test-permisos.mjs

      - name: test-rondas (rondas de maquetas y verificador)
        run: node tools/test-rondas.mjs

      - name: test-verify-build (proyectos simples y monorepos)
        run: node tools/test-verify-build.mjs

      - name: test-memoria-viva (correcciones, retomar, memoria por archivo, comprobador y recuerdo >= 90 %)
        run: node tools/test-memoria-viva.mjs

      - name: test-tarjetas (una tarjeta no pasa a done sin Verificado, Cumple y devlog)
        run: node tools/test-tarjetas.mjs

      - name: test-cierre (no cerrar con archivos propios sin commitear; no tocar los de otro agente)
        run: node tools/test-cierre.mjs

      - name: test-arranque (el paso del método que falta antes de escribir código)
        run: node tools/test-arranque.mjs

      - name: test-convenciones (las selladas no se alteran por ningún camino ni formato de ruta)
        run: node tools/test-convenciones.mjs

      - name: test-falsos-positivos (los muros no frenan lo legítimo y siguen frenando el ataque)
        run: node tools/test-falsos-positivos.mjs

      - name: test-version (aviso de Senzu desactualizado, sin red)
        run: node tools/test-version.mjs

      - name: test-backend (una feature no se da por hecha sin test, migración probada ni .env.example)
        run: node tools/test-backend.mjs

      - name: test-arquitectura (capas, contextos de DDD, controlador sin ORM, DTO y carpetas declaradas)
        run: node tools/test-arquitectura.mjs

      - name: test-trafico (histórico de clones y visitas, badge de clones)
        run: node tools/test-trafico.mjs

      - name: test-logos (logo elegido, Claude y Codex)
        run: node tools/test-logos.mjs

      - name: test-brand (guía de marca en senzu/ y tokens junto a ella)
        run: node tools/test-brand.mjs

      - name: 'Playwright y Chromium (para la geometría de ui-verify)'
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium

      - name: test-geometria (alineación medida en píxeles, navegador real)
        run: node tools/test-geometria.mjs

      - name: test-movil (móvil pensado - hover, menú burger usado de verdad, tamaños)
        run: node tools/test-movil.mjs

      - name: test-fisica (intros y loaders que se rompen, objeto que cae, página que se desmorona)
        run: node tools/test-fisica.mjs

      - name: test-init-parity (instalador PowerShell = instalador Node)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-init-parity.ps1
